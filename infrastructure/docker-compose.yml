services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: assistant-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-assistant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-assistant}
      POSTGRES_DB: ${POSTGRES_DB:-assistant}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-assistant} -d ${POSTGRES_DB:-assistant}']
      interval: 5s
      timeout: 5s
      retries: 10

  # Agent Server（仅服务端部署；本地开发可继续用 npm run start）
  app:
    profiles: ['server']
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: assistant-app
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
      # 微信媒体发送工具回调桥
      WEIXIN_BRIDGE_URL: http://weixin-bridge:3100
      PORT: 3000
      # 容器内通过 compose 网络访问 postgres 服务，而非 localhost
      DATABASE_URL: postgres://${POSTGRES_USER:-assistant}:${POSTGRES_PASSWORD:-assistant}@postgres:5432/${POSTGRES_DB:-assistant}
    command: ['sh', '-lc', '/app/team-site/start.sh && exec npm start']
    ports:
      - '127.0.0.1:${APP_PORT:-3000}:3000'
    volumes:
      # 宿主机仓库作为 /app（含 .git），bot 的 self.commit 可直接提交推送；
      # node_modules 用命名卷避免污染宿主目录
      - ../:/app
      - app_node_modules:/app/node_modules
      # 生产加固：不挂载 Docker 套接字（容器内代理不能再启动容器、映射端口），
      # 不挂载全部 ~/.ssh（最小权限原则）。如果 git push 需要 SSH 认证，请将
      # GitHub 部署密钥（read-write）放在 /home/ubuntu/.ssh/promise-ai-deploy，
      # 并按需在仓库内配置 .git/config（或 GIT_SSH_COMMAND）指定该 key；
      # 若已通过 GitHub App / token（.env 注入）认证，则无需 SSH 挂载。
      # 当前配置保留 /projects 工作区挂载（只读项目浏览，无安全风险）。
      - /home/ubuntu/projects:/projects
    depends_on:
      postgres:
        condition: service_healthy

  # 微信 ClawBot 桥接（iLink 长轮询 -> agent-server -> 微信回复）
  weixin-bridge:
    profiles: ['server']
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: assistant-weixin
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
      WEIXIN_PORT: 3100
      # 容器内通过 compose 网络访问 agent-server
      AGENT_URL: http://app:3000
      WEIXIN_STATE_DIR: /data/weixin
      WEIXIN_FILES_DIR: /data/weixin-files
      WEIXIN_BOT_AGENT: PromiseAi/0.1.0
    command: ['npm', 'run', 'weixin:bridge']
    ports:
      - '127.0.0.1:${WEIXIN_PORT:-3100}:3100'
    volumes:
      - weixin-data:/data/weixin
      # 微信文件库：宿主机仓库根目录 weixin-files/ 直接可见，丢文件即入库
      - ../weixin-files:/data/weixin-files
      # 与 app 一样挂载仓库源码（self.commit 改动对桥同样生效）
      - ../:/app
      - bridge_node_modules:/app/node_modules
    # 镜像内置的健康检查指向 :3000（agent-server），这里覆盖为 bridge 自己的端口
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:3100/health']
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      app:
        condition: service_started


  # 官网入口代理：纳入 Compose，避免手工容器失去健康检查与开机恢复。
  team-site-proxy:
    profiles: ['server']
    image: alpine/socat
    container_name: team-site-proxy
    restart: unless-stopped
    command: ['TCP-LISTEN:80,fork,reuseaddr', 'TCP:app:80']
    ports:
      - '80:80'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O - http://127.0.0.1:80/ >/dev/null || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      app:
        condition: service_started

volumes:
  postgres-data:
  weixin-data:
  app_node_modules:
  bridge_node_modules:
