<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Promise AI · 她的世界</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #10131a; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #e7e9f0; }
    #scene { position: fixed; inset: 0; }
    .panel {
      position: fixed; z-index: 10; background: rgba(18, 22, 32, 0.78);
      border: 1px solid rgba(255,255,255,0.08); border-radius: 14px;
      backdrop-filter: blur(14px); padding: 12px 14px; font-size: 13px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.35);
    }
    #top { top: 14px; left: 14px; min-width: 260px; }
    #top h1 { font-size: 14px; font-weight: 600; margin-bottom: 6px; }
    #top .meta { color: #9aa3b5; font-size: 12px; line-height: 1.7; }
    #top .activity { font-size: 14px; color: #e7e9f0; margin-bottom: 4px; }
    #events { right: 14px; top: 14px; max-height: 46vh; overflow: auto; max-width: 300px; }
    #events h2 { font-size: 12px; margin-bottom: 6px; color: #9aa3b5; }
    #events ul { list-style: none; }
    #events li { padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 12px; color: #c7cdda; }
    #events li .t { color: #7f8a9d; font-size: 11px; display: block; }
    #act { bottom: 14px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; align-items: center; max-width: 92vw; }
    #act input {
      width: 280px; max-width: 60vw; background: rgba(255,255,255,0.07); color: #e7e9f0;
      border: 1px solid rgba(255,255,255,0.14); border-radius: 999px; padding: 8px 16px; font-size: 13px; outline: none;
    }
    #act input::placeholder { color: #7f8a9d; }
    #act button {
      border: 1px solid rgba(255,255,255,0.14); background: rgba(255,255,255,0.08); color: #e7e9f0;
      border-radius: 999px; padding: 8px 16px; font-size: 13px; cursor: pointer;
    }
    #act button:hover { background: rgba(255,255,255,0.16); }
    .hint { position: fixed; bottom: 78px; left: 50%; transform: translateX(-50%); font-size: 12px; color: #6f7a8d; z-index: 10; }
    @media (max-width: 640px) {
      #events { display: none; }
      #top { max-width: 60vw; }
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
      "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.5.5/lib/three-vrm.module.js"
    }
  }
  </script>
</head>
<body>
  <div id="scene"></div>
  <div class="panel" id="top">
    <h1>✦ 她的世界</h1>
    <div class="activity" id="activity">加载中…</div>
    <div class="meta" id="meta"></div>
  </div>
  <div class="hint">拖动旋转 · 滚轮缩放</div>
  <div class="panel" id="events">
    <h2>她的今天</h2>
    <ul id="events-list"><li>加载中…</li></ul>
  </div>
  <div class="panel" id="act">
    <input id="act-input" placeholder="让她做点什么，比如「去阳台看晚霞」" maxlength="60" />
    <button id="act-btn">去做</button>
  </div>
  <script type="module" src="/world/app.js"></script>
</body>
</html>
