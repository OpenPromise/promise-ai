# ============================================================
# 世界第一 AI 工作室官网 · nginx 配置（Phase 3 已写好，Phase 4 部署时启用）
#
# 拓扑：nginx 静态托管 frontend/dist + /api/* 反代到 Node 后端(127.0.0.1:8080)
# 依据：docs/architecture.md §1；部署路径按本仓库布局 /app/team-site/frontend/dist，
#       如部署机目录不同需同步修改 root。
# 注意：本阶段不执行部署（任务明确）；如 80 已被占用，部署前需先释放（历史任务占用过）。
# ============================================================

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;
    charset         utf-8;

    # 文本类资源 gzip
    gzip              on;
    gzip_min_length   1k;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;

    server {
        listen       80;
        server_name  _;

        # 前端构建产物（Phase 4 部署前先在前端目录执行 npm run build）
        root   /app/team-site/frontend/dist;
        index  index.html;

        # SPA 前端路由回退（React Router 刷新/直达地址都落到 index.html）
        location / {
            try_files $uri $uri/ /index.html;
        }

        # 静态资源缓存：public/assets 与带 hash 的构建产物
        location /assets/ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
        }

        # 内容 API 反代到 Node 后端（保留 /api 前缀）
        location /api/ {
            proxy_pass         http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # 健康检查直连后端（供监控探活）
        location = /health {
            proxy_pass http://127.0.0.1:8080/health;
            access_log off;
        }
    }
}
